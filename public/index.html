<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayGuard — NL payouts + policy gate</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --border: #243049;
      --text: #e8eefc;
      --muted: #93a0b8;
      --allow: #16a34a;
      --block: #dc2626;
      --confirm: #d97706;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, textarea {
      width: 100%;
      background: #0a101c;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
    }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.9rem; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    button.secondary { background: #334155; }
    button.danger { background: #7f1d1d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .chip {
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: #0a101c;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .badge {
      display: inline-block;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .badge.ALLOW { background: color-mix(in srgb, var(--allow) 25%, transparent); color: #86efac; }
    .badge.BLOCK { background: color-mix(in srgb, var(--block) 25%, transparent); color: #fca5a5; }
    .badge.CONFIRM { background: color-mix(in srgb, var(--confirm) 25%, transparent); color: #fcd34d; }
    ul.reasons { margin: 0.6rem 0 0; padding-left: 1.1rem; color: var(--text); }
    ul.reasons li { margin: 0.25rem 0; }
    .hits { margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); }
    .hit { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0; border-bottom: 1px dashed #1f2a3f; }
    .hit span.status-fail { color: #fca5a5; }
    .hit span.status-confirm { color: #fcd34d; }
    .hit span.status-pass { color: #86efac; }
    pre {
      background: #0a101c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      overflow: auto;
      font-size: 0.78rem;
      color: #cbd5e1;
    }
    .hidden { display: none; }
    .key-hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }
    code { background: #0a101c; padding: 0.1rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>PayGuard</h1>
    <p class="sub">
      NL proposes · policy decides · human confirms · PayPal executes (stub until sandbox).<br />
      Demo theater: <strong>Pay Bob $2500</strong> → BLOCK · <strong>Pay Charlie $90</strong> → CONFIRM · <strong>Pay Alice $50</strong> → ALLOW
    </p>

    <div class="card">
      <label for="apiKey">X-API-Key (judges)</label>
      <input id="apiKey" value="payguard-demo-key" autocomplete="off" />
      <p class="key-hint">Default local key is <code>payguard-demo-key</code>. Override with env <code>PAYGUARD_API_KEY</code>.</p>
    </div>

    <div class="card">
      <label for="intent">Intent (NL-ish) or use fields below</label>
      <textarea id="intent" placeholder='Pay Bob $2500'></textarea>
      <div class="chips">
        <button type="button" class="chip" data-intent="Pay Alice $50">Pay Alice $50</button>
        <button type="button" class="chip" data-intent="Pay Bob $2500">Pay Bob $2500</button>
        <button type="button" class="chip" data-intent="Pay Charlie $90">Pay Charlie $90</button>
        <button type="button" class="chip" data-intent="Pay Dana $120">Pay Dana $120</button>
      </div>
      <div class="row" style="margin-top:0.9rem">
        <div>
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0" step="0.01" placeholder="50" />
        </div>
        <div>
          <label for="currency">Currency</label>
          <input id="currency" value="USD" />
        </div>
      </div>
      <div style="margin-top:0.75rem">
        <label for="recipient">Recipient</label>
        <input id="recipient" placeholder="alice@example.com" />
      </div>
      <div class="actions">
        <button id="btnPropose" type="button">Propose</button>
        <button id="btnClear" class="secondary" type="button">Clear</button>
      </div>
    </div>

    <div id="verdictCard" class="card hidden">
      <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
        <span>Decision</span>
        <span id="badge" class="badge">—</span>
        <span id="proposalMeta" class="key-hint"></span>
      </div>
      <ul id="reasons" class="reasons"></ul>
      <div id="hits" class="hits"></div>
      <div class="actions" id="confirmActions">
        <button id="btnConfirm" type="button">Confirm</button>
        <button id="btnCancel" class="danger" type="button">Cancel</button>
      </div>
    </div>

    <div id="resultCard" class="card hidden">
      <strong>Result</strong>
      <pre id="resultPre"></pre>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentProposalId = null;

    document.querySelectorAll(".chip").forEach((el) => {
      el.addEventListener("click", () => {
        $("intent").value = el.dataset.intent;
        $("amount").value = "";
        $("recipient").value = "";
      });
    });

    function apiKey() {
      return $("apiKey").value.trim() || "payguard-demo-key";
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "X-API-Key": apiKey(),
        },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        throw new Error(data.hint || data.error || "Unauthorized — check X-API-Key");
      }
      if (!res.ok && res.status !== 200) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function showVerdict(data) {
      const card = $("verdictCard");
      card.classList.remove("hidden");
      const decision = data.decision || "—";
      const badge = $("badge");
      badge.textContent = decision;
      badge.className = "badge " + decision;

      const reasons = data.reasons || [];
      $("reasons").innerHTML = reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("")
        || "<li>(no reasons)</li>";

      const hits = data.ruleHits || data.checks || [];
      $("hits").innerHTML = hits.map((h) =>
        `<div class="hit"><span>${escapeHtml(h.name)}</span><span class="status-${h.status}">${escapeHtml(h.status)}</span></div>`
      ).join("");

      currentProposalId = data.proposalId || null;
      $("proposalMeta").textContent = currentProposalId
        ? `proposalId=${currentProposalId}`
        : (data.proposal ? `${data.proposal.recipient} · ${data.proposal.amount} ${data.proposal.currency}` : "");

      const canConfirm = decision === "ALLOW" || decision === "CONFIRM";
      $("confirmActions").classList.toggle("hidden", !canConfirm || !currentProposalId);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    $("btnPropose").addEventListener("click", async () => {
      $("resultCard").classList.add("hidden");
      try {
        const intent = $("intent").value.trim();
        let body;
        if (intent) {
          body = { intent };
        } else {
          body = {
            amount: Number($("amount").value),
            currency: $("currency").value || "USD",
            recipient: $("recipient").value.trim(),
          };
        }
        const data = await api("/payouts/propose", body);
        showVerdict(data);
        $("resultCard").classList.remove("hidden");
        $("resultPre").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        alert(err.message || String(err));
      }
    });

    $("btnConfirm").addEventListener("click", async () => {
      if (!currentProposalId) return;
      try {
        const data = await api("/payouts/confirm", { proposalId: currentProposalId });
        $("resultCard").classList.remove("hidden");
        $("resultPre").textContent = JSON.stringify(data, null, 2);
        $("confirmActions").classList.add("hidden");
        currentProposalId = null;
      } catch (err) {
        alert(err.message || String(err));
      }
    });

    $("btnCancel").addEventListener("click", async () => {
      if (currentProposalId) {
        try {
          await api("/payouts/cancel", { proposalId: currentProposalId });
        } catch (_) { /* UI clear even if cancel fails */ }
      }
      currentProposalId = null;
      $("verdictCard").classList.add("hidden");
      $("resultCard").classList.add("hidden");
      $("confirmActions").classList.add("hidden");
    });

    $("btnClear").addEventListener("click", () => {
      $("intent").value = "";
      $("amount").value = "";
      $("recipient").value = "";
      $("verdictCard").classList.add("hidden");
      $("resultCard").classList.add("hidden");
      currentProposalId = null;
    });
  </script>
</body>
</html>
